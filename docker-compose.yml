services:
  api:
    build:
      context: ./backend
    container_name: backend_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ELASTICSEARCH_URL=http://elastic_search:9200
      - TZ=America/New_York
    depends_on:
      elastic_search:
        condition: service_healthy
  elastic_search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.11
    container_name: elastic_search
    ports:
      - "9200:9200"
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.11
    container_name: kibana_local
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic_search:9200
    depends_on:
      elastic_search:
        condition: service_healthy


  # Runs once at startup. Retries until /insert succeeds, then exits.
  startup_refresh:
    image: curlimages/curl:latest
    depends_on:
      api:
        condition: service_started
      elastic_search:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo 'Waiting for API...';
       until curl -sf http://api:8000/ >/dev/null; do
         echo '  API not ready yet...';
         sleep 2;
       done;

       echo 'Running startup refresh (retry until success)...';
       until curl -sf http://api:8000/insert >/dev/null; do
         echo '  Insert failed, retrying in 3s...';
         sleep 3;
       done;

       echo 'Startup refresh done.'"

  # Keeps running and refreshes daily (86400s). Also waits for readiness.
  scheduler:
    image: curlimages/curl:latest
    depends_on:
      api:
        condition: service_started
      elastic_search:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until curl -sf http://api:8000/ >/dev/null; do sleep 2; done;
       while true; do
         echo 'Refreshing ES...';
         curl -sf http://api:8000/insert || echo 'Refresh failed';
         sleep 86400;
       done"

volumes:
  es_data: